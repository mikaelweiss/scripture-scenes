<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scene Style Bake-off</title>
<style>
  :root { --bg: #f6f1e7; --ink: #2b2620; --muted: #7a6f60; --card: #fffaf0; --line: #e4dccb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1916; --ink: #eee6d8; --muted: #a39887; --card: #24211d; --line: #37322b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 1200px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  p.sub { margin: 0 0 28px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; }
  a.card { display: block; background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; color: inherit; text-decoration: none; transition: transform .15s; }
  a.card:hover { transform: translateY(-3px); }
  .thumb { aspect-ratio: 16 / 9; background: var(--line) center / cover no-repeat; }
  .meta { padding: 12px 14px 14px; }
  .meta h2 { margin: 0; font-size: 17px; }
  .meta p { margin: 2px 0 0; font-size: 14px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>3 Nephi 11: Christ at the Temple in Bountiful</h1>
  <p class="sub">One scene, ten visual styles. Click one to walk through it.</p>
  <div class="grid" id="grid"></div>
</main>
<script>
  const styles = [
    ['lowpoly', 'Low-poly 3D', 'Flat-shaded facets, first person'],
    ['voxel', 'Voxel', 'World built from cubes'],
    ['papercraft', 'Paper cutout', 'Flat cardboard standees in 3D'],
    ['pixel', 'Pixel art RPG', '16-bit top-down'],
    ['silhouette', 'Silhouette', 'Parallax side-scroller'],
    ['painterly', 'Painterly', 'Watercolor post-processing'],
    ['isometric', 'Isometric diorama', 'Miniature world, orthographic'],
    ['clay', 'Clay miniature', 'Soft shapes, tilt-shift'],
    ['retro', 'Retro PS1', 'Low-res, dithered, foggy'],
    ['toon', 'Cel-shaded ink', 'Toon shading with outlines'],
  ];
  document.getElementById('grid').innerHTML = styles.map(([dir, name, desc]) => `
    <a class="card" href="styles/${dir}/">
      <div class="thumb" style="background-image:url(styles/${dir}/preview.png)"></div>
      <div class="meta"><h2>${name}</h2><p>${desc}</p></div>
    </a>`).join('');
</script>
</body>
</html>
