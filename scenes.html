<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scenes from the Standard Works</title>
<style>
  :root { --bg: #f6f1e7; --ink: #2b2620; --muted: #7a6f60; --card: #fffaf0; --line: #e4dccb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b1916; --ink: #eee6d8; --muted: #a39887; --card: #24211d; --line: #37322b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 1400px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 28px; }
  h2 { margin: 36px 0 12px; font-size: 21px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .thumbs { display: grid; grid-template-columns: 1fr 1fr; }
  .thumbs a { aspect-ratio: 16 / 9; background: var(--line) center / cover no-repeat; position: relative; }
  .thumbs a span { position: absolute; left: 6px; bottom: 6px; font-size: 11px; color: #fff; background: rgba(0,0,0,.5); padding: 1px 6px; border-radius: 4px; }
  .meta { padding: 10px 12px 12px; }
  .meta h3 { margin: 0; font-size: 15px; }
  .meta p { margin: 2px 0 0; font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Scenes from the Standard Works</h1>
  <div id="books"></div>
</main>
<script type="module">
  import scenes from './scenes.js';
  const styles = [['lowpoly', 'Low-poly'], ['toon', 'Toon']];
  const books = [...new Set(scenes.map((s) => s.book))];
  const esc = (t) => t.replace(/[&<>"]/g, (c) => `&#${c.charCodeAt(0)};`);
  document.getElementById('books').innerHTML = books.map((book) => `
    <h2>${book}</h2>
    <div class="grid">${scenes.filter((s) => s.book === book).map((s) => `
      <div class="card">
        <div class="thumbs">${styles.map(([dir, name]) => `
          <a href="styles/${dir}/?scene=${s.id}" style="background-image:url(styles/${dir}/scenes/${s.id}.png)"><span>${name}</span></a>`).join('')}
        </div>
        <div class="meta"><h3>${esc(s.title)}</h3><p>${esc(s.ref)}</p></div>
      </div>`).join('')}
    </div>`).join('');
</script>
</body>
</html>
