<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Christ at Bountiful (Clay)</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #d8bd9a; font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif; }
  canvas { display: block; touch-action: none; }
  .hud { position: fixed; left: 16px; pointer-events: none; color: #3b2a1c; }
  #title { top: 14px; font-size: 19px; font-weight: 700; padding: 8px 14px; border-radius: 14px; background: rgba(255, 246, 230, 0.78); box-shadow: 0 3px 0 rgba(90, 60, 30, 0.25); }
  #hint { bottom: 14px; font-size: 13px; line-height: 1.45; padding: 7px 12px; border-radius: 12px; background: rgba(255, 246, 230, 0.7); box-shadow: 0 2px 0 rgba(90, 60, 30, 0.2); }
  #hint b { font-weight: 700; }
  @media (max-width: 600px) { #title { font-size: 15px; right: 16px; } #hint { font-size: 12px; right: 16px; } }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title" class="hud"></div>
<div id="hint" class="hud"><b>WASD / arrows</b> walk · <b>Shift</b> run · <b>drag</b> orbit · <b>wheel</b> zoom<br>Touch: drag left side to walk, right side to look</div>
<script type="module">
  import scene from './scene.js';
  import { run } from './engine/main.js';
  document.getElementById('title').textContent = scene.title;
  window.clay = run(scene, document.body);
</script>
</body>
</html>
