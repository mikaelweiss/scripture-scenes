<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3 Nephi 11 · Retro</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; touch-action: none; }
  canvas#view { position: fixed; inset: 0; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  .hud { position: fixed; left: 16px; color: #f4e6c4; font: bold 15px/1.35 "Courier New", ui-monospace, monospace;
         text-shadow: 2px 2px 0 #1a120a; pointer-events: none; letter-spacing: 0.5px; }
  #title { top: 14px; font-size: 18px; text-transform: uppercase; }
  #title small { display: block; font-size: 12px; color: #cdb88f; text-transform: none; }
  #hint { bottom: 14px; font-size: 12px; color: #d8c7a0; max-width: calc(100vw - 32px); }
  @media (max-width: 640px) { #title { font-size: 13px; } #hint { font-size: 11px; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<canvas id="view"></canvas>
<div id="title" class="hud"></div>
<div id="hint" class="hud"></div>
<script type="module">
  import scene from './scene.js';
  import { run } from './engine/index.js';
  run(scene, document.getElementById('view'));
</script>
</body>
</html>
