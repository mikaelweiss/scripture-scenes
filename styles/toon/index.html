<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>3 Nephi 11: Christ at the Temple in Bountiful</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #efd8ad; }
    canvas { display: block; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <script type="module">
    import { createWorld } from './engine/world.js';
    const id = new URLSearchParams(location.search).get('scene');
    const { default: scene } = await import(id ? `./scenes/${id}.js` : './scene.js');
    document.title = scene.title;
    createWorld(scene, document.body);
  </script>
</body>
</html>
