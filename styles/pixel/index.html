<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>3 Nephi 11: Christ at the Temple in Bountiful</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0810; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
  #view { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; image-rendering: crisp-edges; touch-action: none; }
  .hud { position: absolute; left: 12px; color: #fbe9c0; font: bold 15px/1.3 ui-monospace, Menlo, Consolas, monospace; text-shadow: 2px 2px 0 #1b1020; pointer-events: none; }
  #title { top: 10px; right: 12px; font-size: 16px; letter-spacing: 0.5px; }
  #hint { bottom: 10px; right: 12px; font-size: 12px; font-weight: normal; color: #e8dcc0; opacity: 0.9; }
  #dialog {
    display: none; position: absolute; left: 50%; bottom: 34px; transform: translateX(-50%);
    width: min(720px, calc(100% - 32px)); box-sizing: border-box; padding: 12px 16px 10px;
    background: linear-gradient(#26337e, #121a4c); color: #fff;
    border: 3px solid #f4eedb; border-radius: 6px; box-shadow: 0 0 0 3px #160d26, inset 0 0 0 2px #4b5bb0;
    font: 15px/1.5 ui-monospace, Menlo, Consolas, monospace; min-height: 84px;
  }
  #dialog .who { color: #ffd77a; font-weight: bold; margin-bottom: 4px; }
  #dialog .ref { color: #b8c0ea; font-size: 12px; text-align: right; margin-top: 4px; }
  #talk {
    display: none; position: absolute; right: 18px; bottom: 60px; width: 64px; height: 64px; border-radius: 50%;
    border: 3px solid #f4eedb; background: #8a2f2f; color: #fff; font: bold 14px ui-monospace, Menlo, monospace;
    box-shadow: 0 0 0 3px #160d26;
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="title" class="hud"></div>
<div id="hint" class="hud"></div>
<div id="dialog"><div class="who"></div><div class="text"></div><div class="ref"></div></div>
<button id="talk">TALK</button>
<script type="module">
  import scene from './scene.js';
  import { start } from './engine.js';
  document.getElementById('title').textContent = scene.title;
  start(scene);
</script>
</body>
</html>
