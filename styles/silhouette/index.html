<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3 Nephi 11: Christ at the Temple in Bountiful</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c090e; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  .ui { position: fixed; color: #fbefd9; font-family: Georgia, 'Times New Roman', serif; pointer-events: none; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7), 0 0 14px rgba(0, 0, 0, 0.55); }
  #title { top: 18px; left: 22px; font-size: 19px; letter-spacing: 0.04em; }
  #title small { display: block; font-size: 12px; opacity: 0.65; letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }
  #hint { bottom: 16px; left: 22px; font-size: 12.5px; opacity: 0.75; letter-spacing: 0.05em; }
  #caption { top: 11%; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 48px)); text-align: center;
    font-size: 17px; font-style: italic; line-height: 1.5; opacity: 0; transition: opacity 1.4s ease; }
  #caption.show { opacity: 0.92; }
  #caption cite { display: block; font-style: normal; font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.7; margin-top: 6px; }
  @media (max-width: 600px) { #title { font-size: 15px; left: 16px; } #hint { left: 16px; } #caption { font-size: 15px; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ui" id="title">3 Nephi 11: Christ at the Temple in Bountiful<small id="count"></small></div>
<div class="ui" id="hint">← → or A / D to walk toward the temple · Shift to hurry · touch: hold or drag left / right</div>
<div class="ui" id="caption"></div>
<script type="module">
  import { run } from './engine.js';
  import scene from './scene.js';
  run(document.getElementById('c'), scene, {
    caption: document.getElementById('caption'),
    count: document.getElementById('count'),
  });
</script>
</body>
</html>
